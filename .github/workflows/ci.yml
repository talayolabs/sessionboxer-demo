name: CI
on: [push, pull_request]
jobs:
  html:
    name: HTML check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate markup
        run: |
          grep -q '<title>' index.html
          grep -q 'rel="stylesheet"' index.html
          ! grep -n 'TODO' index.html styles.css
